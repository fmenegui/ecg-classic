# Unit tests and the infrastructure rules (tests/test_infra_rules.py) on every push: free runner.
name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q -e . pytest pyyaml
      - run: python -m pytest -q tests
