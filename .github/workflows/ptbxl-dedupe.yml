name: PTB-XL / Kaggle overlap
# Lists the PTB-XL records that are also in the Kaggle competition training set (matched on the
# signal), so that the row network never trains on an ECG used for evaluation.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . wfdb kaggle==2.2.5 kagglesdk==0.1.38 six==1.17.0 pandas
      - name: PTB-XL (100 Hz)
        run: |
          wget -q -O ptbxl.zip https://physionet.org/static/published-projects/ptb-xl/ptb-xl-a-large-publicly-available-electrocardiography-dataset-1.0.3.zip
          unzip -q ptbxl.zip '*/ptbxl_database.csv' '*/records100/*' -d ptbxl_raw
          rm ptbxl.zip
          mv ptbxl_raw/* ptbxl
          ls ptbxl | head
      - name: Kaggle signals (one file per record, slowly)
        run: |
          python - <<'PY'
          import csv, sys, time
          from pathlib import Path
          sys.path.insert(0, "benchmarks/physionet")
          from run import download
          d = Path("kaggle")
          meta = download("train.csv", d)
          ids = [r["id"] for r in csv.DictReader(open(meta))]
          print(len(ids), "records", flush=True)
          miss = 0
          for i, rid in enumerate(ids):
              try:
                  download(f"train/{rid}/{rid}.csv", d / rid)
                  time.sleep(1.5)
              except Exception as e:
                  miss += 1
                  print("failed", rid, str(e)[:100], flush=True)
              if i % 100 == 0:
                  print(i, "done", flush=True)
          print("missing", miss)
          PY
      - run: python hybrid/ptbxl/dedupe.py --ptbxl ptbxl --kaggle kaggle --out exclude_ptbxl.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ptbxl-dedupe
          path: |
            exclude_ptbxl.txt
            exclude_ptbxl.json
