# Which RunPod data centers work for us: one 2-vCPU pod per data center checks that the pod
# answers through the RunPod HTTP proxy (the follower reads its log) and that the Kaggle
# competition archive is reachable from there (kaggle_zip.py probe: one range request, nothing
# kept). Chooses where the data volume should live. ~0.07 USD/h per pod, a few minutes.
name: RunPod data center probe
on:
  workflow_dispatch:
    inputs:
      dcs:
        description: data centers, comma separated
        default: 'EU-RO-1,EU-CZ-1,US-KS-2,EUR-IS-1'
      image:
        description: pod image (empty = the CPU default, python:3.11-bookworm)
        default: ''
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      dcs: ${{ steps.p.outputs.dcs }}
    steps:
      - id: p
        run: echo "dcs=$(python3 -c "import json;print(json.dumps('${{ inputs.dcs }}'.split(',')))")" >> "$GITHUB_OUTPUT"
  probe:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dc: ${{ fromJson(needs.plan.outputs.dcs) }}
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
      REF: ${{ github.ref_name }}
      MAX_HOURS: '0.4'
      VCPU: '2'
      WAIT_MIN: '10'
      BALANCE_RESERVE: '1'
      CPU_DCS: ${{ matrix.dc }}
      CPU_IMAGE: ${{ inputs.image || 'python:3.11-bookworm' }}
      EXCLUDE_DCS: 'none'
    steps:
      - name: Job start time
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start the CPU pod
        id: pod
        env:
          SHARD: ${{ strategy.job-index }}
          JOB: >-
            pip install -q remotezip requests && echo "data center ${{ matrix.dc }}" &&
            python benchmarks/physionet/kaggle_zip.py probe --out /root/kprobe 2>&1 | grep -vE "^\s*$" | head -20
        run: |
          tok=$(python -c 'import secrets; print(secrets.token_hex(24))'); echo "::add-mask::$tok"
          UPLOAD_TOKEN=$tok python hybrid/gpu/runpod_v2.py cpu-start
      - name: Follow
        env:
          POD_ID: ${{ steps.pod.outputs.pod_id }}
        run: FOLLOW_UNTIL=$(( JOB_T0 + 45 * 60 )) python hybrid/gpu/runpod_ctl.py follow --out result
      - name: Verdict
        if: always()
        run: |
          L=result/log.txt
          if [ ! -s "$L" ]; then echo "${{ matrix.dc }}: pod did not answer through the proxy" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          k=$(grep -m1 -E "range request|no signed URL|HTTP 4" "$L" || true)
          echo "${{ matrix.dc }}: proxy ok; kaggle: ${k:-no answer}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Terminate the pod
        if: always()
        env:
          POD_ID: ${{ steps.pod.outputs.pod_id }}
        run: python hybrid/gpu/runpod_v2.py stop
