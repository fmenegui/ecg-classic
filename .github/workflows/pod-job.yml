# A command on one RunPod CPU pod, with the data volume at /workspace: long CPU work that
# should stay next to the data (building the real Kaggle strips once for every training run,
# filling caches). Only the pod's log comes back; whatever the job writes stays on the volume.
# The job must not print competition data.
name: Job on a RunPod CPU pod
on:
  workflow_dispatch:
    inputs:
      job:
        description: command (run in the repository at the ref; $CACHE = /workspace/cache on the volume)
        required: true
      vcpu:
        description: vCPU (2-32; ~0.035 USD/h each)
        default: '32'
      max_hours:
        default: '3'
      kaggle:
        description: give the pod the Kaggle token
        type: boolean
        default: false
      tag:
        default: job
permissions:
  contents: read
jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      REF: ${{ github.ref_name }}
      MAX_HOURS: ${{ inputs.max_hours }}
      VCPU: ${{ inputs.vcpu }}
    steps:
      - name: Job start time
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Volume
        id: vol
        run: python hybrid/gpu/runpod_v2.py volume
      - name: Start the CPU pod
        id: pod
        env:
          VOLUME_ID: ${{ steps.vol.outputs.volume_id }}
          DATA_CENTER: ${{ steps.vol.outputs.data_center }}
          KAGGLE_API_TOKEN: ${{ inputs.kaggle && secrets.KAGGLE_API_TOKEN || '' }}
          KAGGLE_USERNAME: ${{ inputs.kaggle && vars.KAGGLE_USERNAME || '' }}
          JOB: ${{ inputs.job }}
        run: |
          tok=$(python -c 'import secrets; print(secrets.token_hex(24))'); echo "::add-mask::$tok"
          UPLOAD_TOKEN=$tok python hybrid/gpu/runpod_v2.py cpu-start
      - name: Pod id, readable while the job runs (https://<pod>-8000.proxy.runpod.net/log.txt)
        run: echo "${{ steps.pod.outputs.pod_id }}" > pod_id.txt
      - uses: actions/upload-artifact@v4
        with:
          name: podid-${{ github.run_id }}
          path: pod_id.txt
          retention-days: 3
      - name: Follow
        env:
          POD_ID: ${{ steps.pod.outputs.pod_id }}
        run: FOLLOW_UNTIL=$(( JOB_T0 + 340 * 60 )) python hybrid/gpu/runpod_ctl.py follow --out result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: podjob-${{ inputs.tag }}-${{ github.run_id }}
          path: result/log.txt
          retention-days: 30
      - name: Terminate the pod
        if: always()
        env:
          POD_ID: ${{ steps.pod.outputs.pod_id }}
        run: python hybrid/gpu/runpod_v2.py stop
