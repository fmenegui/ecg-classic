name: PhysioNet (Kaggle) in parallel
on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Config fields, e.g. "synth=False bridge=False" (optional)'
        required: false
        default: ''
        type: string
      tag:
        description: 'Artifact label'
        required: false
        default: 'run'
        type: string
permissions:
  contents: read
env:
  IDS: '119693645,1257259783,1280609341,1449491391,1962423499,2295597388,235672018,2587667307,2841936136,3042142152,322694441,3275080079,3574249147,3646789790,3879757040,4050029009,426433979,644026427,994226251,996604037'
jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
      COMP: physionet-ecg-image-digitization
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . kaggle==2.2.5 kagglesdk==0.1.38 six==1.17.0 pandas
      - name: Cache (20 records)
        id: c
        uses: actions/cache/restore@v4
        with:
          path: results/physionet/data
          key: physionet-all20-v1
          restore-keys: physionet-p20-
      # gather what previous runs already downloaded (each restore adds files)
      - uses: actions/cache/restore@v4
        if: steps.c.outputs.cache-hit != 'true'
        with:
          path: results/physionet/data
          key: physionet-data-n20--v1
      - uses: actions/cache/restore@v4
        if: steps.c.outputs.cache-hit != 'true'
        with:
          path: results/physionet/data
          key: physionet-shard-0-v1
      - uses: actions/cache/restore@v4
        if: steps.c.outputs.cache-hit != 'true'
        with:
          path: results/physionet/data
          key: physionet-shard-1-v1
      - uses: actions/cache/restore@v4
        if: steps.c.outputs.cache-hit != 'true'
        with:
          path: results/physionet/data
          key: physionet-shard-2-v1
      - uses: actions/cache/restore@v4
        if: steps.c.outputs.cache-hit != 'true'
        with:
          path: results/physionet/data
          key: physionet-shard-3-v1
      - name: Download what is missing
        id: dl
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          python benchmarks/physionet/run.py prefetch --ids "$IDS" --out results/physionet | tee pf.log
          if grep -q "^missing 0" pf.log; then echo "full=1" >> "$GITHUB_OUTPUT"; else echo "full=0" >> "$GITHUB_OUTPUT"; fi
      - name: Save (complete)
        if: steps.c.outputs.cache-hit != 'true' && steps.dl.outputs.full == '1'
        uses: actions/cache/save@v4
        with:
          path: results/physionet/data
          key: physionet-all20-v1
      - name: Save (partial)
        if: steps.c.outputs.cache-hit != 'true' && steps.dl.outputs.full != '1'
        uses: actions/cache/save@v4
        with:
          path: results/physionet/data
          key: physionet-p20-${{ github.run_id }}
  shard:
    needs: prefetch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
      COMP: physionet-ecg-image-digitization
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pandas kaggle==2.2.5 kagglesdk==0.1.38 six==1.17.0
      - uses: actions/cache/restore@v4
        with:
          path: results/physionet/data
          key: physionet-all20-v1
          restore-keys: physionet-p20-
      - name: Evaluate
        env:
          PHYSIONET_KEEP_DATA: '1'
          PART: ${{ matrix.part }}
        run: |
          SUB=$(python -c "import os;i=os.environ['IDS'].split(',');p=int(os.environ['PART']);print(','.join(i[p*5:(p+1)*5]))")
          ARGS=""
          for kv in ${{ inputs.config }}; do ARGS="$ARGS --config $kv"; done
          python benchmarks/physionet/run.py eval --n 5 --jobs 4 --keep-raw 0 --ids "$SUB" --out results/physionet $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ inputs.tag }}-${{ matrix.part }}-${{ github.run_id }}
          path: |
            results/physionet/
            !results/physionet/data/**
            !results/physionet/raw/**/*.png
          retention-days: 14
