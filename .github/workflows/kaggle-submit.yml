name: Kaggle late submission (CPU)
# Uploads the ecgdig source as a private Kaggle dataset, pushes kaggle/submission.py as a private
# CPU script kernel (no internet) attached to the competition, waits for its run on the public test
# images, submits that kernel version to "PhysioNet - Digitization of ECG Images" and waits for the
# score. Needs the secret KAGGLE_API_TOKEN and the variable KAGGLE_USERNAME. 5 submissions per day.
on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Submission message'
        required: false
        default: 'ecgdig classical (CPU)'
        type: string
      submit:
        description: 'Submit after the kernel run (false = only check that the kernel runs)'
        required: false
        default: true
        type: boolean
      kernel_version:
        description: 'Only submit this already-run kernel version (skips upload and run)'
        required: false
        default: ''
        type: string
      row_model_run:
        description: 'Hybrid: gpu-train run whose unet_best.pt is the row network (empty = classical)'
        required: false
        default: ''
        type: string
      page_model_run:
        description: 'Hybrid: gpu-train run of the page-structure network (page_best.onnx)'
        required: false
        default: ''
        type: string
      status_only:
        description: 'Only wait for the newest submission score (no upload, run or submit)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
      COMP: physionet-ecg-image-digitization
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install kaggle==2.2.5 kagglesdk==0.1.38 six==1.17.0
      - name: Dataset with the ecgdig source (private)
        if: inputs.kernel_version == '' && !inputs.status_only
        env:
          GH_TOKEN: ${{ github.token }}
          ROW_RUN: ${{ inputs.row_model_run }}
          PAGE_RUN: ${{ inputs.page_model_run }}
        run: |
          U="$KAGGLE_USERNAME"; D=dist/ecgdig-src
          mkdir -p $D && cp -r ecgdig $D/ && rm -rf $D/ecgdig/__pycache__ && cp LICENSE $D/ 2>/dev/null || true
          # hybrid: the networks (private dataset: the row network was trained with Kaggle pages) and
          # onnxruntime wheels for the offline kernel
          if [ -n "$ROW_RUN$PAGE_RUN" ]; then
            mkdir -p $D/models $D/wheels
            for py in 3.10 3.11 3.12 3.13; do   # Kaggle's image is on 3.13 (Nov 22)
              python -m pip download -q onnxruntime==1.20.1 --only-binary=:all: --python-version $py \
                --platform manylinux_2_27_x86_64 --platform manylinux_2_28_x86_64 -d $D/wheels || true
            done
            python -m pip download -q coloredlogs humanfriendly flatbuffers --only-binary=:all: --no-deps -d $D/wheels || true
            ls $D/wheels
          fi
          if [ -n "$ROW_RUN" ]; then
            gh run download "$ROW_RUN" -D row_dl
            p=$(find row_dl -name unet_best.pt | head -1); [ -n "$p" ] || p=$(find row_dl -name unet.pt | head -1)
            python -m pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
            python -m pip install -q segmentation-models-pytorch==0.3.4 timm onnx onnxscript onnxruntime
            python - "$p" $D/models/row.onnx <<'PY'
          import sys, torch, segmentation_models_pytorch as smp
          m = smp.Unet(encoder_name="resnet34", encoder_weights=None, in_channels=3, classes=1)
          sd = torch.load(sys.argv[1], map_location="cpu"); sd = sd.get("model", sd) if isinstance(sd, dict) else sd
          m.load_state_dict(sd); m.eval()
          torch.onnx.export(m, torch.zeros(1, 3, 256, 256), sys.argv[2], input_names=["x"], output_names=["logit"],
                            dynamic_axes={"x": {0: "n", 2: "h", 3: "w"}, "logit": {0: "n", 2: "h", 3: "w"}}, opset_version=17, dynamo=False)
          PY
            rm -rf row_dl
          fi
          if [ -n "$PAGE_RUN" ]; then
            python -m pip install -q onnxruntime
            gh run download "$PAGE_RUN" -D page_dl
            for f in $(find page_dl -name page_best.onnx) $(find page_dl -name page.onnx); do
              python -c "import onnxruntime as o, sys; o.InferenceSession(sys.argv[1])" "$f" && cp "$f" $D/models/page.onnx && break
            done
            rm -rf page_dl
          fi
          ls -la $D $D/models 2>/dev/null || true
          cat > $D/dataset-metadata.json <<JSON
          {"title": "ecgdig-src", "id": "$U/ecgdig-src", "licenses": [{"name": "apache-2.0"}]}
          JSON
          if kaggle datasets status "$U/ecgdig-src" >/dev/null 2>&1; then
            kaggle datasets version -p $D -m "ecgdig ${GITHUB_SHA::7}" -r zip
          else
            kaggle datasets create -p $D -r zip
          fi
          for i in $(seq 1 60); do
            s=$(kaggle datasets status "$U/ecgdig-src" 2>&1 || true); echo "dataset: $s"
            echo "$s" | grep -qi ready && break; sleep 20
          done
      - name: Push the CPU script kernel and wait for its run
        id: kernel
        if: inputs.kernel_version == '' && !inputs.status_only
        run: |
          U="$KAGGLE_USERNAME"; K=dist/kernel; SLUG=${{ inputs.row_model_run != '' && 'ecgdig-hybrid-submission' || 'ecgdig-classical-submission' }}
          mkdir -p $K && cp kaggle/submission.py $K/
          cat > $K/kernel-metadata.json <<JSON
          {"id": "$U/$SLUG", "title": "$SLUG", "code_file": "submission.py",
           "language": "python", "kernel_type": "script", "is_private": true, "enable_gpu": false,
           "enable_tpu": false, "enable_internet": false, "dataset_sources": ["$U/ecgdig-src"],
           "competition_sources": ["$COMP"], "kernel_sources": [], "model_sources": []}
          JSON
          out=$(kaggle kernels push -p $K 2>&1); echo "$out"
          V=$(echo "$out" | grep -oiE "version [0-9]+" | grep -oE "[0-9]+" | tail -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"; echo "slug=$U/$SLUG" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 120); do
            s=$(kaggle kernels status "$U/$SLUG" 2>&1 || true); echo "$(date -u +%H:%M) $s"
            echo "$s" | grep -qiE "complete|error|cancel" && break; sleep 60
          done
          mkdir -p kout && kaggle kernels output "$U/$SLUG" -p kout >/dev/null 2>&1 || true
          ls -la kout; tail -30 kout/*.log 2>/dev/null || true
          echo "$s" | grep -qi complete
      - name: Submit and wait for the score
        if: inputs.submit && !inputs.status_only
        env:
          SLUG: ${{ steps.kernel.outputs.slug }}
          VER: ${{ inputs.kernel_version || steps.kernel.outputs.version }}
          MSG: ${{ inputs.message }}
        run: |
          python - <<'PY'
          import os, time
          from kaggle.api.kaggle_api_extended import KaggleApi
          api = KaggleApi(); api.authenticate()
          slug = os.environ.get("SLUG") or f"{os.environ['KAGGLE_USERNAME']}/ecgdig-classical-submission"
          ver = int(os.environ["VER"]); comp = os.environ["COMP"]
          for fn in ["submission.csv"]:   # the competition only accepts this name
              try:
                  r = api.competition_submit_code(fn, f"{os.environ['MSG']} {os.environ['GITHUB_SHA'][:7]}", comp,
                                                  kernel=slug, kernel_version=ver)
                  print("submitted", fn, r); break
              except Exception as e:  # show the server's reason (the CLI hides it)
                  resp = getattr(e, "response", None)
                  print("submit failed with", fn, e, resp.text[:1000] if resp is not None else "")
          PY
      - name: Wait for the newest submission's score
        if: (inputs.submit || inputs.status_only)
        run: |
          # the newest submission is the first data row (row 3); older rows are COMPLETE already
          for i in $(seq 1 160); do
            out=$(kaggle competitions submissions "$COMP" 2>&1 | head -6); echo "$(date -u +%H:%M)"; echo "$out"
            echo "$out" | sed -n 3p | grep -qiE "complete|error" && break; sleep 120
          done
          echo "$out" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggle-kernel-output
          path: kout/
          retention-days: 30
