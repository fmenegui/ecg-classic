# Is the environment ready? Run before a batch of experiments (~10 min, a few cents).
#   1. unit and infrastructure tests (free runner)
#   2. Kaggle archive reachable from GitHub (free runner)
#   3. RunPod: balance, the data volume, and a 2-vCPU pod on it that must answer through the proxy,
#      write to the volume and reach the Kaggle archive; the pod is always terminated
# Every check prints OK or FAIL in the run summary.
name: Environment check
on:
  workflow_dispatch:
    inputs:
      volume_name:
        description: 'RunPod data volume by name (empty = ecgdig-data3; ecgdig-data2 is in EU-RO-1); never created when given'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q -e . pytest pyyaml
      - name: Tests
        run: |
          python -m pytest -q tests && echo "OK tests" >> "$GITHUB_STEP_SUMMARY" || { echo "FAIL tests" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q remotezip requests
      - name: Kaggle archive from GitHub
        run: |
          python benchmarks/physionet/kaggle_zip.py probe --out kdata 2>&1 | tee probe.txt
          grep -q "range request: 206" probe.txt && echo "OK Kaggle archive (GitHub runner)" >> "$GITHUB_STEP_SUMMARY" \
            || { echo "FAIL Kaggle archive (GitHub runner)" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
  runpod:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
      REF: ${{ github.ref_name }}
      MAX_HOURS: '0.5'
      VCPU: '2'
      WAIT_MIN: '15'
      BALANCE_RESERVE: '1'
      BOOT_MIN: '25'
      QUEUE_MIN: '5'   # the account's 64-vCPU limit: our own CPU pods can hold it for hours; report, do not wait
    steps:
      - name: Job start time
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Volume
        id: vol
        env:
          VOLUME_NAME: ${{ inputs.volume_name || 'ecgdig-data3' }}
          VOLUME_NO_CREATE: ${{ inputs.volume_name && '1' || '' }}
        run: |
          python hybrid/gpu/runpod_v2.py volume && echo "OK volume" >> "$GITHUB_STEP_SUMMARY" \
            || { echo "FAIL volume" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
      - name: Start a 2-vCPU pod on the volume (prints the balance)
        id: pod
        env:
          VOLUME_ID: ${{ steps.vol.outputs.volume_id }}
          DATA_CENTER: ${{ steps.vol.outputs.data_center }}
          JOB: >-
            echo "data center ${{ steps.vol.outputs.data_center }}" &&
            touch /workspace/.envcheck && rm /workspace/.envcheck && echo "volume writable" &&
            df -h /workspace | tail -1 &&
            python benchmarks/physionet/kaggle_zip.py probe --out /root/kprobe 2>&1 | grep -E "attempt|range request"
        run: |
          tok=$(python -c 'import secrets; print(secrets.token_hex(24))'); echo "::add-mask::$tok"
          UPLOAD_TOKEN=$tok python hybrid/gpu/runpod_v2.py cpu-start 2>&1 | tee start.txt
          grep -m1 "RunPod balance" start.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: Follow
        env:
          POD_ID: ${{ steps.pod.outputs.pod_id }}
        run: FOLLOW_UNTIL=$(( JOB_T0 + 50 * 60 )) python hybrid/gpu/runpod_ctl.py follow --out result
      - name: Verdict
        if: always()
        run: |
          L=result/log.txt
          if grep -q "concurrent vCPUs" start.txt 2>/dev/null; then
            echo "FAIL no CPU pod could start: the account's 64 vCPUs are in use (running pod-eval / pod-job runs); rerun when they finish" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          if [ ! -s "$L" ]; then echo "FAIL pod did not answer through the proxy" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          echo "OK pod answered through the proxy" >> "$GITHUB_STEP_SUMMARY"
          grep -q "volume writable" "$L" && echo "OK volume writable" >> "$GITHUB_STEP_SUMMARY" || echo "FAIL volume not writable" >> "$GITHUB_STEP_SUMMARY"
          grep -q "range request: 206" "$L" && echo "OK Kaggle archive (pod)" >> "$GITHUB_STEP_SUMMARY" || echo "FAIL Kaggle archive (pod)" >> "$GITHUB_STEP_SUMMARY"
          grep -q "range request: 206" "$L" && grep -q "volume writable" "$L"
      - name: Terminate the pod
        if: always()
        env:
          POD_ID: ${{ steps.pod.outputs.pod_id }}
        run: python hybrid/gpu/runpod_v2.py stop
