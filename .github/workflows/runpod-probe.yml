name: RunPod probe
# Read-only: prints what the RunPod account and API offer (data centers, CPU flavors, volumes,
# GraphQL inputs) for the evaluation infrastructure. Prints no secret.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python hybrid/gpu/runpod_probe.py
