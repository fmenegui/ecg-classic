name: Hybrid - trace segmenter training (CPU)
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Training minutes'
        required: false
        default: '320'
        type: string
      steps:
        description: 'Steps (cap)'
        required: false
        default: '40000'
        type: string
      init_run:
        description: 'Run id whose trace-seg artifact (unet.pt) to continue from (optional)'
        required: false
        default: ''
        type: string
      lr:
        description: 'Peak learning rate'
        required: false
        default: '0.002'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . onnx onnxruntime
      - name: Previous weights
        if: ${{ inputs.init_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ inputs.init_run }} -n trace-seg-${{ inputs.init_run }} -D prev
      - name: Train
        run: |
          INIT=""
          if [ -f prev/unet.pt ]; then INIT="--init prev/unet.pt"; fi
          python hybrid/train.py --steps ${{ inputs.steps }} --minutes ${{ inputs.minutes }} --lr ${{ inputs.lr }} --workers 3 --out hybrid/out $INIT
      - name: Samples
        if: always()
        run: python hybrid/gen.py hybrid/out/samples.png 7 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-seg-${{ github.run_id }}
          path: hybrid/out/
          retention-days: 30
