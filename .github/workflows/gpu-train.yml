name: GPU training on RunPod
# Starts a RunPod GPU pod, runs a training command there (hybrid/gpu/pod.sh), follows its log,
# brings the result back as an artifact and ALWAYS terminates the pod at the end (also on error,
# cancellation or time limit). Needs the repository secret RUNPOD_API_KEY. The pod only gets the
# optional RENDERER_TOKEN (read-only, to install the private ecg-torch-renderer).
on:
  workflow_dispatch:
    inputs:
      kaggle:
        description: 'Pass the Kaggle token to the pod (real training pages for hybrid/realstrips_build.py)'
        required: false
        default: false
        type: boolean
      gpu:
        description: 'RunPod GPU type id; empty = cheap cards only (A5000, 3090, A4500, 4000 Ada, A4000), at most 0.5 USD/h'
        required: false
        default: ''
        type: string
      max_hours:
        description: 'Hard limit for the training command (hours); the pod is terminated after it'
        required: false
        default: '1'
        type: string
      job:
        description: 'Command run in the repository on the pod'
        required: false
        default: 'python hybrid/train_gpu.py --minutes 45 --out /workspace/out'
        type: string
      use_volume:
        description: 'Try the data center of the data volume first (cached bank and real strips; JOB uses $CACHE and $OUT_DIR). Off by default: since Nov 19 ~15:20 UTC pods in EUR-IS-1 do not answer through the RunPod HTTP proxy'
        required: false
        default: false
        type: boolean
      init_run:
        description: 'An earlier gpu-train run to continue from: its *_best.pt checkpoints are sent to the pod as /workspace/in/<name> (use --init there)'
        required: false
        default: ''
        type: string
      eval_models:
        description: 'After training, run the development benchmark on free GitHub runners (pmcardio per_scenario=5 + kaggle-full stride=20) with these models; THIS = this run (e.g. "page=THIS row=44206699093")'
        required: false
        default: ''
        type: string
      tag:
        description: 'Label'
        required: false
        default: 'gpu'
        type: string
permissions:
  contents: read
  actions: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RENDERER_TOKEN: ${{ secrets.RENDERER_TOKEN }}   # optional, read-only, for the private ecg-torch-renderer
      # the Kaggle token goes to the pod only when asked (real training pages read on the pod, never published)
      KAGGLE_API_TOKEN: ${{ inputs.kaggle && secrets.KAGGLE_API_TOKEN || '' }}
      KAGGLE_USERNAME: ${{ inputs.kaggle && vars.KAGGLE_USERNAME || '' }}
    steps:
      - name: Job start time (the follower stops before the 355 min job limit)
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Checkpoints to continue from
        if: ${{ inputs.init_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ inputs.init_run }} -D init_dl
          mkdir -p init
          for f in page_best.pt unet_best.pt dewarp_best.pt; do
            g=$(find init_dl -name "$f" | head -1); [ -n "$g" ] && cp "$g" init/
          done
          rm -rf init_dl; ls -la init
      - name: Data volume
        id: vol
        if: ${{ inputs.use_volume }}
        run: python hybrid/gpu/runpod_v2.py volume || true
      - name: Train on a pod (a pod whose CUDA fails is replaced)
        env:
          GPU: ${{ inputs.gpu }}
          MAX_HOURS: ${{ inputs.max_hours }}
          JOB: ${{ inputs.job }}
          REF: ${{ github.ref_name }}
          VOLUME_ID: ${{ steps.vol.outputs.volume_id }}
          DATA_CENTER: ${{ steps.vol.outputs.data_center }}
        run: |
          export UPLOAD_TOKEN=$(python -c 'import secrets; print(secrets.token_hex(24))'); echo "::add-mask::$UPLOAD_TOKEN"
          FOLLOW_UNTIL=$(( JOB_T0 + 340 * 60 )) python hybrid/gpu/runpod_ctl.py run --out result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-${{ inputs.tag }}-${{ github.run_id }}
          path: result/
          retention-days: 30
      - name: Development benchmark of the new model
        if: ${{ success() && inputs.eval_models != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # free GitHub runners (20 shards each), not a paid pod: 300 PM-ECG-ID ECGs (5 per
          # scenario) and every 20th Kaggle record of each shard (~49 records, ~440 images)
          M=$(echo "${{ inputs.eval_models }}" | sed "s/THIS/${{ github.run_id }}/g")
          F=""
          for kv in $M; do F="$F -f ${kv%%=*}_model_run=${kv#*=}"; done
          gh workflow run pmcardio.yml --ref "${{ github.ref_name }}" -f per_scenario=5 -f tag="dev-${{ inputs.tag }}" $F
          gh workflow run kaggle-full.yml --ref "${{ github.ref_name }}" -f stride=20 -f tag="dev-${{ inputs.tag }}" \
            $(echo "$F" | sed 's/-f grid_model_run=[^ ]*//')
          echo "development benchmark started (pmcardio + kaggle-full, tag dev-${{ inputs.tag }}) with: $M" >> "$GITHUB_STEP_SUMMARY"
      - name: Terminate the pod
        if: always()
        run: python hybrid/gpu/runpod_ctl.py stop   # every pod named ecgdig-train
