name: GPU training on RunPod
# Starts a RunPod GPU pod, runs a training command there (hybrid/gpu/pod.sh), follows its log,
# brings the result back as an artifact and ALWAYS terminates the pod at the end (also on error,
# cancellation or time limit). Needs the repository secret RUNPOD_API_KEY. The pod only gets the
# optional RENDERER_TOKEN (read-only, to install the private ecg-torch-renderer).
on:
  workflow_dispatch:
    inputs:
      kaggle:
        description: 'Pass the Kaggle token to the pod (real training pages for hybrid/realstrips_build.py)'
        required: false
        default: false
        type: boolean
      gpu:
        description: 'RunPod GPU type id; empty = cheap cards only (A5000, 3090, A4500, 4000 Ada, A4000), at most 0.5 USD/h'
        required: false
        default: ''
        type: string
      max_hours:
        description: 'Hard limit for the training command (hours); the pod is terminated after it'
        required: false
        default: '1'
        type: string
      job:
        description: 'Command run in the repository on the pod'
        required: false
        default: 'python hybrid/train_gpu.py --minutes 45 --out /workspace/out'
        type: string
      tag:
        description: 'Label'
        required: false
        default: 'gpu'
        type: string
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RENDERER_TOKEN: ${{ secrets.RENDERER_TOKEN }}   # optional, read-only, for the private ecg-torch-renderer
      # the Kaggle token goes to the pod only when asked (real training pages read on the pod, never published)
      KAGGLE_API_TOKEN: ${{ inputs.kaggle && secrets.KAGGLE_API_TOKEN || '' }}
      KAGGLE_USERNAME: ${{ inputs.kaggle && vars.KAGGLE_USERNAME || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Train on a pod (a pod whose CUDA fails is replaced)
        env:
          GPU: ${{ inputs.gpu }}
          MAX_HOURS: ${{ inputs.max_hours }}
          JOB: ${{ inputs.job }}
          REF: ${{ github.ref_name }}
        run: python hybrid/gpu/runpod_ctl.py run --out result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-${{ inputs.tag }}-${{ github.run_id }}
          path: result/
          retention-days: 30
      - name: Terminate the pod
        if: always()
        run: python hybrid/gpu/runpod_ctl.py stop   # every pod named ecgdig-train
