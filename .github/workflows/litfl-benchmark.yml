name: LITFL benchmark
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Número de imagens (0 = todas)'
        required: false
        default: '0'
        type: string
  pull_request:
    paths:
      - 'ecgdig/**'
      - 'benchmarks/litfl/**'
jobs:
  litfl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/cache@v4
        with:
          path: benchmarks/litfl/cache
          key: litfl-images-v1
      - name: Benchmark
        run: python benchmarks/litfl/run.py --limit "${{ inputs.limit || '0' }}" --jobs 2 --compare benchmarks/litfl/baseline.json
      - name: Relatório no resumo do job
        if: always()
        run: cat results/litfl/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: litfl-benchmark
          path: results/litfl/
          retention-days: 14
