name: LITFL benchmark
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of images (0 = all)'
        required: false
        default: '0'
        type: string
      config:
        description: 'Config fields, space separated (optional)'
        required: false
        default: ''
        type: string
  pull_request:
    paths:
      - 'ecgdig/**'
      - 'benchmarks/litfl/**'
jobs:
  litfl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Benchmark
        run: |
          ARGS=""
          for kv in ${{ inputs.config }}; do ARGS="$ARGS --config $kv"; done
          python benchmarks/litfl/run.py --limit "${{ inputs.limit || '0' }}" --jobs 4 --compare benchmarks/litfl/baseline.json $ARGS
      - name: Report in the job summary
        if: always()
        run: cat results/litfl/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: litfl-benchmark
          path: results/litfl/
          retention-days: 14
